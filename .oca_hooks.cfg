# Конфіг OCA pre-commit hooks для цього репо.
# po-pretty-format вимкнено НАВМИСНО: source-мова модуля — українська
# (msgid українські), тому uk_UA.po містить 506 self-translations (msgid==msgstr),
# які Odoo вимагає для коректного відображення. po-pretty-format --fix трактує
# їх як noise і видаляє → інцидент 2026-05-06 (zadarma: зрізало 144 uk + 10 pl).
# Решта OCA-перевірок лишаються активними.
[MESSAGES_CONTROL]
disable = po-pretty-format
